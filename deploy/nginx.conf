# GRIDGO landing site — nginx served on plain HTTP, port 3000.
#
# TLS is terminated by Cloudflare in Flexible mode in front of the server, so
# this container MUST NOT redirect to HTTPS: behind Flexible mode that produces
# an infinite redirect loop.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare and the reverse proxy already log; keep the container quiet
    # apart from real errors.
    access_log off;

    # Cloudflare re-compresses on the edge, but the proxy hop is plain HTTP.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        model/gltf-binary;

    # Pre-compressed assets from the build, when the client accepts them.
    gzip_static on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health endpoint for compose and the reverse proxy. Cheap, no filesystem.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ── App downloads ────────────────────────────────────────────────────────
    # `~/gridgo/downloads` on the host, mounted read-only. Each app's build
    # writes <slug>.apk plus a <slug>.json sidecar here; this site only reads
    # them. A file that has not been uploaded 404s, and the page renders its
    # honest "not available yet" state.
    #
    # `^~` stops the SPA fallback and the static-asset regex below from
    # swallowing these paths.
    location ^~ /downloads/ {
        alias /srv/gridgo-downloads/;
        autoindex off;
        default_type application/octet-stream;
        types {
            application/json                        json;
            application/vnd.android.package-archive apk;
        }

        # Sidecars describe the current build — never serve a stale one.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~ ^/downloads/(?<apk_file>[A-Za-z0-9._-]+)\.apk$ {
            alias /srv/gridgo-downloads/$apk_file.apk;
            default_type application/vnd.android.package-archive;
            # No filename= : the browser takes it from the URL, which is
            # already gridgo-client.apk and friends.
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # ── Tutorial videos ──────────────────────────────────────────────────────
    # `~/gridgo/media` on the host, mounted read-only. The /tutorials videos are
    # 40-55 MB each, so they stay out of git and out of this image. nginx serves
    # static files with byte ranges, which is what lets a <video> seek and load
    # only its metadata up front.
    #
    # Filenames carry a version (gridgo-rider-app-tutorial-v1.mp4) and are never
    # overwritten, so a year of immutable cache is safe. The header is added to
    # successful responses only (no `always`): a file that is not uploaded yet
    # must not have its 404 pinned in Cloudflare or the browser for a year.
    #
    # `^~` keeps the static-asset regex below from taking the .jpg posters.
    location ^~ /media/ {
        alias /srv/gridgo-media/;
        autoindex off;
        default_type application/octet-stream;
        types {
            video/mp4  mp4;
            image/jpeg jpg;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # App icons in /app-icons/ are not fingerprinted. A year of immutable
    # cache left the previous 3x3 tiles stuck after the lockup files replaced
    # them at the same URL.
    location ^~ /app-icons/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Static build output ──────────────────────────────────────────────────
    # Vite fingerprints these filenames, so they are safe to cache forever.
    location ~* \.(js|css|woff2?|png|jpe?g|gif|webp|avif|svg|ico|glb|gltf)$ {
        # `expires` would emit a second, weaker Cache-Control alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # react-router owns /support, /download, /tutorials and /desk, so a deep link or a
    # refresh on a non-root route must return index.html rather than 404.
    #
    # `$uri.html` comes first: /privacy and /delete-account are prerendered to
    # privacy.html and delete-account.html at build time, so the policy text is
    # in the HTML for a reader (or a store reviewer) without JavaScript. It is a
    # file lookup, not a redirect, so it is safe behind Cloudflare Flexible.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        # index.html itself is the routing table — never let a client pin an
        # old one against fingerprinted assets that no longer exist.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
